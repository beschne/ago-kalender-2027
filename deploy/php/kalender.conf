; PHP-FPM-Pool für kalender.agorion.de, entspricht /etc/php/8.2/fpm/pool.d/kalender.conf.
; Eigener Benutzer statt www-data, damit die anderen Seiten auf dem Server (u. a. WordPress)
; die Bestelldatenbank weder lesen noch ändern können. Siehe DEPLOYMENT.md.
[kalender]
user = kalender
group = kalender

; nginx (www-data) spricht den Pool über diesen Socket an.
listen = /run/php/php8.2-fpm-kalender.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 60s

; PHP darf nur Webroot, Datenverzeichnis und eigene Sessions sehen.
php_admin_value[open_basedir] = /var/www/kalender.agorion.de/:/var/www/kalender.agorion.de-data/:/var/lib/php/sessions-kalender/
php_admin_value[session.save_path] = /var/lib/php/sessions-kalender
; Debians Cronjob räumt nur das Standard-Sessionverzeichnis auf, daher hier PHPs eigene GC.
php_admin_value[session.gc_probability] = 1
php_admin_value[session.gc_divisor] = 100
php_admin_value[session.gc_maxlifetime] = 1440
php_admin_flag[file_uploads] = off
