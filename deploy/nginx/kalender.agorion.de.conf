# nginx-Konfiguration für kalender.agorion.de (Muster: ago-sofi-site).
# Entspricht 1:1 /etc/nginx/sites-available/kalender.agorion.de auf dem Server,
# inkl. der von Certbot ergänzten TLS- und Redirect-Blöcke (siehe DEPLOYMENT.md).

# Access-Log mit anonymisierter IP: IPv4 letztes Oktett auf 0, IPv6 nur die ersten
# 32 Bit. map/log_format gelten global (http-Kontext), daher eindeutige Namen.
map $remote_addr $kalender_ip_anonym {
    ~(?P<ip>\d+\.\d+\.\d+)\.\d+   $ip.0;
    ~(?P<ip>[^:]+:[^:]+):          $ip::;
    default                         0.0.0.0;
}

log_format kalender_anonym '$kalender_ip_anonym - $remote_user [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Rate-Limits: Bestellungen (nur POST, leerer Schlüssel = unbegrenzt) und Admin-Bereich
# (bremst das Durchprobieren von Passwörtern). Zusätzlich zum Limit pro Session in index.php,
# das sich mit einem neuen Cookie umgehen lässt.
map $request_method $kalender_post_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $kalender_post_key zone=kalender_post:1m rate=2r/m;
limit_req_zone $binary_remote_addr zone=kalender_admin:1m rate=60r/m;

server {
    server_name kalender.agorion.de;
    root /var/www/kalender.agorion.de;
    index index.php;

    access_log /var/log/nginx/kalender.agorion.de-access.log kalender_anonym;

    # Formular und Admin brauchen nur wenige KB.
    client_max_body_size 64k;

    # Gilt für alle Locations ohne eigenes limit_req: 5 Bestellungen sofort, danach eine
    # alle 30 Sekunden pro IP-Adresse.
    limit_req zone=kalender_post burst=5 nodelay;
    limit_req_status 429;

    error_page 404 /404.php;

    # Statische Störungsseite, falls PHP-FPM nicht antwortet. Fehler innerhalb von PHP
    # zeigt inc/helpers.php selbst mit derselben Datei an.
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }

    # Gilt für alle Antworten dieser Seite. Achtung: nginx vererbt add_header nicht in
    # Locations, die selbst add_header setzen -- daher unten nur "expires" verwenden.
    # HSTS: Browser nutzen ein Jahr lang nur noch HTTPS. Bewusst ohne includeSubDomains,
    # damit andere agorion.de-Subdomains nicht betroffen sind.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # Saubere URLs ohne ".php" (z. B. /datenschutz). Das Anhängen von ".php" muss über
    # die benannte Location per "rewrite ... last" laufen, sonst liefert nginx den
    # PHP-Quelltext als statische Datei aus (siehe ago-sofi-site).
    location / {
        try_files $uri $uri/ @clean_php;
    }

    location @clean_php {
        rewrite ^(.*)$ $1.php last;
    }

    # Admin-Oberfläche: HTTP-Basic-Auth. "^~", damit die allgemeine PHP-Location unten
    # hier nie greift; die verschachtelte PHP-Location wird trotzdem ausgewertet.
    location ^~ /admin/ {
        auth_basic "AGO Kalender Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-kalender-admin;
        # Großzügig, weil jedes Häkchen bei der Übergabe mehrere Anfragen erzeugt.
        limit_req zone=kalender_admin burst=40 nodelay;

        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.2-fpm-kalender.sock;
        }
    }

    # Includes und Konfiguration nie direkt ausliefern oder ausführen.
    location ^~ /inc/ {
        deny all;
    }

    location ~ \.php$ {
        # Alte ".php"-URLs auf die saubere URL umleiten ($request_uri statt $uri, sonst
        # Redirect-Schleife mit dem internen Rewrite oben).
        if ($request_uri = /index.php) {
            return 301 /;
        }
        if ($request_uri ~ ^/(datenschutz|impressum)\.php(\?.*)?$) {
            return 301 /$1$2;
        }

        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm-kalender.sock;
    }

    location ~ /\. {
        deny all;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }

    location ~* \.(png|jpe?g|gif|ico|svg|webp)$ {
        expires 30d;
    }

    location ~* \.(css|js)$ {
        expires 7d;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kalender.agorion.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kalender.agorion.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    # Ohne eigenes access_log würde dieser Block das globale Log mit voller IP erben.
    access_log /var/log/nginx/kalender.agorion.de-access.log kalender_anonym;

    if ($host = kalender.agorion.de) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name kalender.agorion.de;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}